[package]
name        = "polymarket-backend"
version = "0.2.5"   # ring latency fix + csv flush + strategy framework + 94 cols
edition     = "2021"
rust-version = "1.91"   # MSRV
default-run = "polymarket-backend"

[features]
default = []
premium-collector = []
premium-patterns  = ["premium-collector"]
premium-executor  = ["premium-patterns"]
premium-all       = ["premium-collector", "premium-patterns", "premium-executor"]

[dependencies]
tokio = { version = "1", features = ["full"] }

polymarket_client_sdk_v2 = { version = "=0.6.0-canary.1", features = ["clob", "gamma", "ctf"] }

alloy = { version = "1.8", default-features = false, features = [
    "signer-local",
    "signers",
] }

tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }

futures-util = "0.3"

anyhow = "1"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

dotenvy = "0.15"

secrecy = { version = "0.10", features = ["serde"] }

# License key system
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# Parquet export (HFT datasets)
parquet = { version = "54", default-features = false, features = ["arrow"] }
arrow = { version = "54", default-features = false, features = ["ffi"] }

# API REST + WebSocket server
axum       = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }

# Base de datos PostgreSQL
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono"] }

# ZIP export (bulk session download)
zip = { version = "2", default-features = false, features = ["deflate"] }

# System metrics for health endpoint
sysinfo = "0.33"

# Allocator optimizado para 2GB Lightsail
mimalloc = "0.1"

[[bin]]
name = "polymarket-backend"
path = "src/main.rs"

[[bin]]
name = "setup"
path = "src/setup.rs"

[[bin]]
name = "license-gen"
path = "src/bin/license-gen.rs"

[profile.release]
opt-level     = 2
lto           = false
codegen-units = 16
strip         = true
panic         = "abort"

[profile.dev]
opt-level = 1
