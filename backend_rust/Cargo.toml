[package]
name        = "polymarket-backend"
version     = "0.3.0"
edition     = "2021"
rust-version = "1.91"
default-run = "polymarket-backend"

[dependencies]
tokio = { version = "1", features = ["full"] }

polymarket_client_sdk_v2 = { version = "=0.6.0-canary.1", features = ["clob", "gamma", "ctf"] }

alloy = { version = "1.8", default-features = false, features = [
    "signer-local",
    "signers",
] }

tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }

futures-util = "0.3"

anyhow = "1"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

dotenvy = "0.15"

axum       = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }

sysinfo = "0.33"

mimalloc = "0.1"

[[bin]]
name = "polymarket-backend"
path = "src/main.rs"

[profile.release]
opt-level     = 2
lto           = false
codegen-units = 16
strip         = true
panic         = "abort"

[profile.dev]
opt-level = 1
