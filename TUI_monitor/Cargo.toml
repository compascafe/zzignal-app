[package]
name = "zzignal-monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Terminal dashboard (TUI) for the ZZignal BTC 15-minute Polymarket engine"
license = "MIT"
repository = "https://github.com/compascafe/zzignal-app"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
chrono = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
