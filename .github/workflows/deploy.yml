name: Deploy App

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          git diff --name-only HEAD~1 HEAD > changed_files.txt
          if grep -q "frontend_react/" changed_files.txt; then
            echo "FRONTEND_CHANGED=true" >> $GITHUB_OUTPUT
          else
            echo "FRONTEND_CHANGED=false" >> $GITHUB_OUTPUT
          fi
          if grep -q "backend_rust/" changed_files.txt; then
            echo "BACKEND_CHANGED=true" >> $GITHUB_OUTPUT
          else
            echo "BACKEND_CHANGED=false" >> $GITHUB_OUTPUT
          fi
          cat $GITHUB_OUTPUT

      - name: Cache npm dependencies
        if: steps.changes.outputs.FRONTEND_CHANGED == 'true'
        uses: actions/cache@v4
        with:
          path: frontend_react/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend_react/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies & Build
        if: steps.changes.outputs.FRONTEND_CHANGED == 'true'
        run: |
          cd frontend_react
          npm install
          npm run build

      - name: Setup Directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/zzignal-app
            sudo mkdir -p /home/ubuntu/zzignal-app
            sudo chown -R ubuntu:ubuntu /home/ubuntu/zzignal-app
            sudo chown -R ubuntu:ubuntu /var/www/zzignal-app

      - name: Deploy Frontend to Server
        if: steps.changes.outputs.FRONTEND_CHANGED == 'true'
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: "ubuntu"
          SOURCE: "frontend_react/dist/"
          TARGET: "/var/www/zzignal-app"

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for backend changes
        id: changes
        run: |
          git diff --name-only HEAD~1 HEAD > changed_files.txt
          if grep -q "backend_rust/" changed_files.txt; then
            echo "BACKEND_CHANGED=true" >> $GITHUB_OUTPUT
          else
            echo "BACKEND_CHANGED=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache Cargo registry
        if: steps.changes.outputs.BACKEND_CHANGED == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        if: steps.changes.outputs.BACKEND_CHANGED == 'true'
        uses: actions/cache@v4
        with:
          path: |
            backend_rust/target/release/.fingerprint
            backend_rust/target/release/deps
            backend_rust/target/release/build
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Install Rust
        if: steps.changes.outputs.BACKEND_CHANGED == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install PostgreSQL client
        if: steps.changes.outputs.BACKEND_CHANGED == 'true'
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Build Rust Backend
        if: steps.changes.outputs.BACKEND_CHANGED == 'true'
        env:
          CARGO_INCREMENTAL: 1
        run: |
          cd backend_rust
          cargo build --release -j $(nproc) --features premium-all

      - name: Package
        if: steps.changes.outputs.BACKEND_CHANGED == 'true'
        run: |
          mkdir -p deploy
          cp backend_rust/target/release/polymarket-backend deploy/
          tar -czf deploy.tar.gz -C deploy .

      - name: Deploy to Server
        if: steps.changes.outputs.BACKEND_CHANGED == 'true'
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: "ubuntu"
          SOURCE: "deploy.tar.gz"
          TARGET: "/home/ubuntu/zzignal-app/"

      - name: Extract & Write .env
        if: steps.changes.outputs.BACKEND_CHANGED == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/zzignal-app
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            echo "${{ secrets.ENV_FILE }}" | base64 -d > .env
            chmod +x polymarket-backend

      - name: Restart Service
        if: steps.changes.outputs.BACKEND_CHANGED == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart zzignal-app