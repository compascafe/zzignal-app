name: Deploy App

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies & Build
        run: |
          cd frontend_react
          npm install
          npm run build

      - name: Setup Directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/zzignal-app
            sudo mkdir -p /home/ubuntu/zzignal-app
            sudo chown -R ubuntu:ubuntu /home/ubuntu/zzignal-app
            sudo chown -R ubuntu:ubuntu /var/www/zzignal-app

      - name: Deploy Frontend to Server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: "ubuntu"
          SOURCE: "frontend_react/dist/"
          TARGET: "/var/www/zzignal-app"

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Build Rust Backend
        run: |
          cd backend_rust
          cargo build --release

      - name: Package
        run: |
          mkdir -p deploy
          cp backend_rust/target/release/polymarket-backend deploy/
          tar -czf deploy.tar.gz -C deploy .

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: "ubuntu"
          SOURCE: "deploy.tar.gz"
          TARGET: "/home/ubuntu/zzignal-app/"

      - name: Extract & Write .env
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/zzignal-app
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            echo "${{ secrets.ENV_FILE }}" | base64 -d > .env
            chmod +x polymarket-backend

      - name: Restart Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart zzignal-app