name: Deploy

# Ships the Rust backend + TUI binaries to a server over SSH.
# This workflow is OPTIONAL and specific to the upstream deployment:
#   - It only runs on the upstream repository (forks are skipped).
#   - It expects the server to run a systemd unit named `zzignal-app`.
# Required GitHub secrets: SERVER_IP_TK, SERVER_SSH_KEY_TK, ENV_FILE
# (ENV_FILE = base64-encoded contents of the production `.env`).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'compascafe/zzignal-app'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directories
        uses: actions/cache@v4
        with:
          path: |
            backend_rust/target/release/.fingerprint
            backend_rust/target/release/deps
            backend_rust/target/release/build
            TUI_monitor/target/release/.fingerprint
            TUI_monitor/target/release/deps
            TUI_monitor/target/release/build
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Install Rust 1.91
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build backend (release)
        env:
          CARGO_INCREMENTAL: 0
        run: cd backend_rust && cargo build --release -j "$(nproc)"

      - name: Build monitor (release)
        run: cd TUI_monitor && cargo build --release -j "$(nproc)"

      - name: Package
        run: |
          mkdir -p deploy
          cp backend_rust/target/release/polymarket-backend deploy/
          cp TUI_monitor/target/release/zzignal-monitor deploy/
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload to server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY_TK }}
          ARGS: "-rlgoDzvc -i"
          REMOTE_HOST: ${{ secrets.SERVER_IP_TK }}
          REMOTE_USER: "ubuntu"
          SOURCE: "deploy.tar.gz"
          TARGET: "/home/ubuntu/zzignal-app/"

      - name: Extract & write .env
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP_TK }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY_TK }}
          script: |
            set -e
            cd /home/ubuntu/zzignal-app
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            echo "${{ secrets.ENV_FILE }}" | base64 -d > .env
            chmod +x polymarket-backend
            chmod +x zzignal-monitor
            test -f polymarket-backend || (echo "FATAL: binary not found after extract" && exit 1)
            echo "Backend size: $(stat -c%s polymarket-backend) bytes"
            echo "Monitor size: $(stat -c%s zzignal-monitor) bytes"

      - name: Restart service & health check
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP_TK }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY_TK }}
          script: |
            set -e
            sudo systemctl restart zzignal-app
            echo "Waiting for service to bind..."
            for i in $(seq 1 10); do
              sleep 2
              if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
                echo "OK: Service is healthy after ${i} attempt(s)"
                exit 0
              fi
              echo "  attempt $i/10: not ready yet..."
            done
            echo "ERROR: Service did not become healthy after 20s"
            sudo journalctl -u zzignal-app --no-pager -n 30
            exit 1
